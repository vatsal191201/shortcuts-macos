name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: bash scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ShortCuts-app
          path: dist/ShortCuts.app
          if-no-files-found: error
